<div class="hero min-h-screen bg-base-200">
  <div class="hero-content flex-col">
    <div class="text-center lg:text-left">
      <h1 class="text-5xl font-bold">
        <p>{{ 'login.title' | transloco }}</p>
      </h1>
      <p class="py-6 text-xl md:text-lg">
        {{ 'login.magicLinkInfo' | transloco }}
      </p>
    </div>
    <div class="card shrink-0 w-full max-w-sm shadow-2xl bg-base-100">
      <form
        #loginForm="ngForm"
        (ngSubmit)="login(loginForm.value.email)"
        class="card-body"
      >
        <div class="form-control">
          <label class="label">
            <span class="label-text">{{ 'email' | transloco }}</span>
          </label>
          <input
            #email="ngModel"
            class="input input-bordered placeholder:opacity-25"
            data-testid="email-input"
            name="email"
            ngModel
            pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}"
            placeholder="example@fithelper.com"
            required
            type="email"
          />
          <fithelper-front-shared-alert-ui
            *ngIf="email.dirty && email.hasError('required')"
            alertType="warning"
            description="{{ 'emailRequired' | transloco }}"
          />
          <fithelper-front-shared-alert-ui
            *ngIf="email.dirty && email.hasError('pattern')"
            alertType="warning"
            data-testid="alert-email-pattern-error"
            description="{{ 'inputShouldBeEmail' | transloco }}"
          />
        </div>
        <div class="form-control mt-3">
          @if (isLoading()) {
            <div class="text-center">
              <fithelper-loader color="text-primary" />
            </div>
          }
          <button
            [disabled]="loginForm.invalid"
            class="btn btn-primary"
            data-testid="login-submit-button"
            type="submit"
          >
            {{ 'login.magicLinkBtnLabel' | transloco }}
          </button>
        </div>
        @if (isEmailSent() && !userError()) {
          <fithelper-front-shared-alert-ui
            description="{{
              'login.checkEmail' | transloco: { email: userEmail() }
            }}"
            alertType="success"
          />
        } @else if (userError()) {
          <fithelper-front-shared-alert-ui
            description="{{
              'login.noAccountEmail' | transloco: { email: userEmail() }
            }}"
            alertType="error"
          />
        }
      </form>
    </div>
    <a
      [routerLink]="['../register']"
      class="link link-hover text-center"
      data-testid="register-link"
      >{{ 'login.noAccount' | transloco }}
      <span class="text-primary">{{
        'login.createAccount' | transloco
      }}</span></a
    >
  </div>
</div>
