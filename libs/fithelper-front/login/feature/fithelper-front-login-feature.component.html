<div class="hero min-h-screen bg-base-200">
  <div class="hero-content flex-col">
    <div class="text-center lg:text-left">
      <h1 class="text-5xl font-bold">
        <p>{{ 'login.title' | transloco }}</p>
      </h1>
      <p class="py-6 text-xl md:text-lg">
        {{ 'login.magicLinkInfo' | transloco }}
      </p>
    </div>
    <div class="card shrink-0 w-full max-w-sm shadow-2xl bg-base-100">
      <form
        #loginForm="ngForm"
        (ngSubmit)="login(loginForm.value.email, loginForm.value.password)"
        class="card-body"
      >
        <div class="form-control">
          <label class="label">
            <span class="label-text">{{ 'email' | transloco }}</span>
          </label>
          <input
            #email="ngModel"
            class="input input-bordered placeholder:opacity-25"
            data-testid="email-input"
            name="email"
            ngModel
            pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}"
            placeholder="example@fithelper.com"
            required
            type="email"
          />
        </div>
        <div class="form-control relative">
          <label class="label">
            <span class="label-text">{{ 'password' | transloco }}</span>
          </label>
          <input
            #password="ngModel"
            class="input input-bordered placeholder:opacity-25"
            data-testid="password-input"
            name="password"
            ngModel
            placeholder="********"
            required
            [type]="passwordInputType()"
          />
          <span class="absolute right-3 top-12">
            @if (showPassword()) {
              <svg
                (click)="this.showPassword.set(false)"
                class="w-6 h-6 opacity-60"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            } @else {
              <svg
                (click)="this.showPassword.set(true)"
                class="w-6 h-6 opacity-60"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            }
          </span>
          <fithelper-front-shared-alert-ui
            *ngIf="email.dirty && email.hasError('required')"
            alertType="warning"
            data-testid="alert-required-email-error"
            description="{{ 'requiredEmail' | transloco }}"
          />
          <fithelper-front-shared-alert-ui
            *ngIf="email.dirty && email.hasError('pattern')"
            alertType="warning"
            data-testid="alert-email-pattern-error"
            description="{{ 'inputShouldBeEmail' | transloco }}"
          />
        </div>
        <div class="form-control mt-3">
          @if (isLoading()) {
            <div class="text-center">
              <fithelper-loader color="text-primary" />
            </div>
          }
          <button
            [disabled]="loginForm.invalid"
            class="btn btn-primary"
            data-testid="login-submit-button"
            type="submit"
          >
            {{ 'login.btnLabel' | transloco }}
          </button>
        </div>
        @if (isEmailSent() && !userError()) {
          <fithelper-front-shared-alert-ui
            description="{{
              'login.checkEmail' | transloco: { email: userEmail() }
            }}"
            dataTestId="login-success"
            alertType="success"
          />
        } @else if (userError()) {
          <fithelper-front-shared-alert-ui
            description="{{
              'login.noAccountEmail' | transloco: { email: userEmail() }
            }}"
            dataTestId="error-non-existent-account"
            alertType="error"
          />
        }
      </form>
    </div>
    <a
      [routerLink]="['../register']"
      class="link link-hover text-center"
      data-testid="register-link"
      >{{ 'login.noAccount' | transloco }}
      <span class="text-primary">{{
        'login.createAccount' | transloco
      }}</span></a
    >
  </div>
</div>
